<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F2EFE7" />
    <title>Imchii wi3awde iji</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23F2EFE7'/%3E%3Ccircle cx='16' cy='16' r='11' fill='%23E94B35'/%3E%3C/svg%3E"
    />
    <script>
      // Set the motion layout before first paint so the intro never flashes the static poster.
      if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
        document.documentElement.classList.add('has-motion');
      }
    </script>
    <link rel="stylesheet" href="/src/scss/main.scss" />
  </head>
  <body>
    <main class="experience">
      <section class="scene scene--expression" aria-label="Imchii wi3awde iji">
        <div class="scene__ink" aria-hidden="true"></div>
        <span class="scene__sun" aria-hidden="true"></span>
        <div class="scene__stage">
          <h1 class="phrase phrase--expression" aria-label="Imchii wi3awde iji">
            <span class="phrase__word">Imchii</span>
            <span class="phrase__word">wi<span class="phrase__accent">3</span>awde</span>
            <span class="phrase__word">iji</span>
          </h1>
        </div>
      </section>

      <section class="scene scene--recomposition" aria-label="Imchii wi3awde iji">
        <span class="scene__sun" aria-hidden="true"></span>
        <div class="scene__stage">
          <h2 class="phrase phrase--recomposition" aria-label="Imchii wi3awde iji">
            <span class="phrase__word">Imchii</span>
            <span class="phrase__word">wi<span class="phrase__accent">3</span>awde</span>
            <span class="phrase__word">iji</span>
          </h2>
        </div>
      </section>
    </main>
    <button class="sound" type="button" hidden>
      <span class="sound__dot" aria-hidden="true"></span>
      <span class="sound__label">Écouter</span>
    </button>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
